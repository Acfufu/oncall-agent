openapi: 3.1.0
info:
  title: Oncall Evidence Workspace HTTP API
  version: M2
  description: Implementation-bound contract. Workspace DTOs snake_case; Alertmanager
    timestamps and migrated legacy archive retain original spelling. Bearer console
    OR oncall_session cookie. Cookie mutations require matching Origin and X-CSRF-Token;
    webhook bearer limited to POST /alert. Missing token configuration fails closed503.
    Ordinary reads120/minute/identity. Protected /mcp and /metrics share authentication.
    No endpoint confirms, silences or remediates alerts. M3 global graph deferred;
    absent from paths. Auth/legacy errors can be smaller {error,...}; detailed uniform
    Error applies to workspace handler errors.
servers:
- url: /
security:
- ConsoleBearer: []
- ConsoleCookie: []
paths:
  /api/v1/system/status:
    get:
      operationId: get_api_v1_system_status
      summary: Probe actual dependency readiness
      description: Database read errors return 503. Dependency fields contain state
        and last_success_at, without URLs or credentials. Capability configuration
        does not establish source health.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SystemStatus'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
                - meta
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Scope or CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '404':
          description: Missing record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version/idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body budget exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limit (Retry-After: 60)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '503':
          description: Dependency unavailable; no synthetic success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Request timeout
          content:
