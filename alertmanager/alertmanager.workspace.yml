route:
  receiver: oncall-agent
  group_by: [alertname, environment, service]
  group_wait: 0s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: oncall-agent
    webhook_configs:
      - url: http://app:8819/alert
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/workspace_webhook_token
