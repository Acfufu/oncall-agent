# Alertmanager 本地 demo 配置（ADR-0005）：route 直推 oncall-agent /alert。
# 应用跑在宿主机 :8819，compose 内经 host.docker.internal 回环；
# Linux 宿主需 compose 里 extra_hosts: host.docker.internal:host-gateway。
route:
  receiver: oncall-agent
  group_by: [alertname]
  group_wait: 0s
  group_interval: 5m
  repeat_interval: 4h   # 控重复诊断成本：同一告警 4h 才重推一次

receivers:
  - name: oncall-agent
    webhook_configs:
      - url: http://host.docker.internal:8819/alert
        send_resolved: false
