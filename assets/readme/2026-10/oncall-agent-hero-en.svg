<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">oncall-agent incident evidence workspace</title>
  <desc id="desc">A read-only incident evidence flow: alert, persisted run events, versioned source snapshots, and a cited report.</desc>
  <rect width="1200" height="400" rx="20" fill="#08121e"/>
  <rect x="1" y="1" width="1198" height="398" rx="19" fill="none" stroke="#263a50" stroke-width="2"/>

  <text x="64" y="64" fill="#77b9ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="2">INCIDENT EVIDENCE / READ-ONLY</text>
  <text x="64" y="143" fill="#eef4fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="64" font-weight="720" letter-spacing="-2">oncall-agent</text>
  <text x="64" y="190" fill="#b3c3d5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="450">Trace each run, source snapshot, and citation.</text>

  <path d="M143 278H416M464 278H736M784 278H1056" fill="none" stroke="#38536e" stroke-width="3" stroke-linecap="round"/>
  <path d="M407 270L417 278L407 286M727 270L737 278L727 286M1047 270L1057 278L1047 286" fill="none" stroke="#77b9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="alert" transform="translate(120 278)">
    <circle r="25" fill="#211e18" stroke="#f3b34b" stroke-width="2.5"/>
    <path d="M0 -12L-11 9H11Z" fill="none" stroke="#f3b34b" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M0 -5V1M0 5V5.5" stroke="#f3b34b" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g id="run-events" transform="translate(440 278)">
    <circle r="25" fill="#111e2c" stroke="#5aa9ff" stroke-width="2.5"/>
    <rect x="-10" y="-12" width="20" height="24" rx="2" fill="none" stroke="#5aa9ff" stroke-width="2"/>
    <path d="M-5 -5H5M-5 0H5M-5 5H2" stroke="#5aa9ff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g id="source-snapshot" transform="translate(760 278)">
    <circle r="25" fill="#102426" stroke="#45c6c8" stroke-width="2.5"/>
    <path d="M-9 -12H4L10 -6V12H-9Z" fill="none" stroke="#45c6c8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M4 -12V-6H10M-5 0H5M-5 5H5" fill="none" stroke="#45c6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="cited-report" transform="translate(1080 278)">
    <circle r="25" fill="#1c1b2b" stroke="#aaa4ff" stroke-width="2.5"/>
    <path d="M-9 -12H4L10 -6V12H-9Z" fill="none" stroke="#aaa4ff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M4 -12V-6H10M-5 0H4M-5 6L-2 9L4 2" fill="none" stroke="#aaa4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" text-anchor="middle">
    <text x="120" y="333" fill="#eef4fb" font-size="21" font-weight="650">Alert</text>
    <text x="440" y="333" fill="#eef4fb" font-size="21" font-weight="650">Run events</text>
    <text x="760" y="333" fill="#eef4fb" font-size="21" font-weight="650">Source snapshot</text>
    <text x="1080" y="333" fill="#eef4fb" font-size="21" font-weight="650">Cited report</text>
    <text x="120" y="361" fill="#91a6bd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1">RECEIVED</text>
    <text x="440" y="361" fill="#91a6bd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1">PERSISTED</text>
    <text x="760" y="361" fill="#91a6bd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1">VERSIONED</text>
    <text x="1080" y="361" fill="#91a6bd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1">INSPECTABLE</text>
  </g>
</svg>
